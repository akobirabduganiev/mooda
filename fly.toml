# Fly.io app configuration for Mooda (Spring Boot WebFlux)
# Rename the app below to your unique Fly app name (flyctl launch can do this)
app = "mooda"
# primary_region = "ams"  # set during `flyctl launch` or change to your preferred region

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly sets PORT=8080 by default; Spring reads server.port from PORT
  PORT = "8080"
  # Optional: set timezone
  APP_TIMEZONE = "Asia/Tashkent"
  # Optional: CORS (comma-separated)
  CORS_ALLOWED_ORIGINS = "*"
  # Optional: OpenAPI/Swagger in prod
  OPENAPI_ENABLED = "true"
  SWAGGER_UI_ENABLED = "true"
  # Disable Liquibase by default to let the app boot even before DB secrets are set (enable later)
  LIQUIBASE_ENABLED = "false"
  # Optional: For email verification links — set to your public backend URL or set VERIFY_URL_BASE directly
  # BACKEND_BASE_URL = "https://mooda.fly.dev"

  # Database configuration is provided via secrets (see DEPLOYING-FLYIO.md):
  # DB_JDBC_URL  -> e.g. jdbc:postgresql://<HOST>:<PORT>/<DB>?user=<USER>&password=<PASS>
  # DB_R2DBC_URL -> e.g. r2dbc:postgresql://<USER>:<PASS>@<HOST>:<PORT>/<DB>
  # JWT_SECRET   -> your JWT signing secret

  # Redis: if you attach Fly Redis (Upstash), it will set REDIS_URL secret (rediss://...)
  # spring will auto-use spring.data.redis.url via application.yml

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 75

[[checks]]
  name = "http-health"
  type = "http"
  interval = "10s"
  timeout = "2s"
  grace_period = "120s"
  method = "get"
  path = "/actuator/health"

# Shared CPU and 512MB RAM are enough for MVP; tune as needed
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
